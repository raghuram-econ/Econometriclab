# Render Blueprint — deploys both halves of Econometrics Lab.
#
# In the Render dashboard: New + → Blueprint → point it at this repository.
# Render reads this file and creates both services automatically.
#
# After the first deploy, set GEMINI_API_KEY on the node service
# (Dashboard → econometrics-lab → Environment) if you want the AI
# features; the statistical engine works without it.


services:
  # Node server: serves the React frontend and the TypeScript engine
  - type: web
    name: econometrics-lab
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && node --max-old-space-size=2048 ./node_modules/vite/bin/vite.js build
    startCommand: node ./node_modules/tsx/dist/cli.mjs server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_BACKEND_URL
        fromService:
          type: web
          name: econometrics-lab-python
          envVarKey: RENDER_EXTERNAL_URL
      - fromGroup: econometrics-shared
      - key: GEMINI_API_KEY
        sync: false


  # Python backend: Heckman, Cox, Johansen, GMM, full ARIMA
  - type: web
    name: econometrics-lab-python
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: econometrics-shared

envVarGroups:
  - name: econometrics-shared
    envVars:
      - key: INTERNAL_SECRET
        generateValue: true
